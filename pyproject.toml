[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-llm"
version = "0.1.0"
description = "Quantum: Privacy-First 11-Stage Fine-Tuning Harness Framework for LLMs"
readme = "README.md"
authors = [{ name = "Quantum Team" }]
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
quantum = "quantum.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["quantum*"]
